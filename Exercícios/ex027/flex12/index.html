<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        body {
            background-color: #363636;
        }

        .container {
            display: flex;
            flex-flow: row nowrap;
            
            background-color: lightslategray;
        }

        .item {
            background-color: lightgray;
            border: 1px solid black;
            text-align: center;
        }

        #caixaA {
            /*
            flex-grow: 1;
            flex-shrink: 0;
            flex-basis: 240px; 
            */

            /* A propriedade FLEX segue a ordem acima, respectivamente */
            flex: 1 0 240px;
        }

        #caixaB {
            /*             
            flex-grow: 1;
            flex-shrink: 1;
            flex-basis: 240px;
            */

            /* A propriedade FLEX segue a ordem acima, respectivamente */
            /* OBS: Valor padrão é flex: 0 1 auto | O valor padrão pode ser decladado como flex: initial */
            flex: 1 1 240px;
        }

        #caixaC {
            /*
            flex-grow: 1;
            flex-shrink: 3;
            flex-basis: 240px;
            */

            /* A propriedade FLEX segue a ordem acima, respectivamente */
            flex: 1 3 240px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="caixaA">A</div>
        <div class="item" id="caixaB">B</div>
        <div class="item" id="caixaC">C</div>
    </div>
</body>
</html>
